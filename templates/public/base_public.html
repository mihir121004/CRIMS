{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>{% block title %}CRIMS{% endblock %}</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="{% static 'css/crims.css' %}?v=20260924" />
    <link rel="stylesheet" href="{% static 'css/responsive.css' %}?v=20260930" />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body class="crims-body">
    <nav class="top-navbar public-navbar">
        <div class="container">
            <a href="{% url 'home' %}" class="public-brand">
                <span class="logo-box logo-box-sm">
                    <i class="bi bi-shield-lock-fill"></i>
                </span>
                <span class="fw-bold text-white">CRIMS</span>
            </a>

            <div class="navbar-nav">
                <a href="#hero" class="nav-link">Home</a>
                <a href="#about" class="nav-link">About</a>
                <a href="#emergency" class="nav-link text-danger">
                    <i class="bi bi-telephone-fill me-1"></i> Emergency
                </a>
            </div>

            <div class="nav-right">
                {% if user.is_authenticated %}
                <a href="{% url 'dashboard' %}" class="btn btn-primary btn-sm">
                    Go to Dashboard
                </a>
                <form method="post" action="{% url 'logout' %}" class="m-0">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-sm btn-outline-danger">
                        Logout
                    </button>
                </form>
                {% else %}
                <a href="{% url 'login' %}" class="public-btn-secondary">
                    <i class="bi bi-box-arrow-in-right me-2"></i> Login
                </a>
                <a href="{% url 'register' %}" class="public-btn-primary">
                    <i class="bi bi-person-plus me-2"></i> Register
                </a>
                {% endif %}
            </div>

            <button type="button"
                    class="public-nav-toggle"
                    aria-label="Toggle navigation menu"
                    aria-expanded="false">
                <i class="bi bi-list"></i>
            </button>
        </div>
    </nav>

    <div class="public-content">
        {% block content %}{% endblock %}
    </div>

    {% include 'components/public_footer.html' %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/responsive.js' %}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Something went wrong &middot; CRIMS</title>
  <style>
    :root {
      --bg: #0b1220;
      --card: #111a2e;
      --border: #1e2a44;
      --text: #e6edf7;
      --muted: #8fa3c0;
      --accent: #3b82f6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      padding: 24px;
    }
    .box {
      max-width: 32rem;
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px 28px;
      text-align: center;
    }
    .icon { font-size: 3rem; line-height: 1; }
    h1 { font-size: 1.5rem; margin: 16px 0 8px; }
    p { color: var(--muted); line-height: 1.6; margin: 0 0 24px; }
    .ref {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      background: #0d1526;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 20px;
      font-size: 0.8rem;
      color: var(--muted);
      word-break: break-all;
    }
    a.btn {
      display: inline-block;
      padding: 10px 18px;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <!--
    Deliberately generic: no exception text, stack trace, SQL or settings are
    exposed. `{% debug %}` is intentionally NOT used - this page renders while
    DEBUG=False, and the previous absence of a 500 template meant Django's
    default page leaked diagnostics.
  -->
  <div class="box">
    <div class="icon">&#9888;</div>
    <h1>Something went wrong</h1>
    <p>
      An unexpected error occurred while processing your request. The incident
      has been logged. Please try again, and if it continues contact your
      system administrator with the reference below.
    </p>
    <div class="ref">Reference: CRIMS-{{ request_id|default:"unavailable" }}</div>
    <a class="btn" href="/">Return home</a>
  </div>
</body>
</html>

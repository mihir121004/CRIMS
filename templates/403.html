<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Access denied &middot; CRIMS</title>
  <style>
    :root {
      --bg: #0b1220;
      --card: #111a2e;
      --border: #1e2a44;
      --text: #e6edf7;
      --muted: #8fa3c0;
      --accent: #3b82f6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      padding: 24px;
    }
    .box {
      max-width: 30rem;
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px 28px;
      text-align: center;
    }
    .icon { font-size: 3rem; line-height: 1; }
    h1 { font-size: 1.5rem; margin: 16px 0 8px; }
    p { color: var(--muted); line-height: 1.6; margin: 0 0 24px; }
    a.btn {
      display: inline-block;
      padding: 10px 18px;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
    }
    a.outline {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      margin-left: 8px;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="icon">&#128683;</div>
    <h1>Access denied</h1>
    <p>
      Your account does not have permission to view this page.
      If you believe this is a mistake, contact your system administrator.
    </p>
    <a class="btn" href="/">Return home</a>
    <a class="btn outline" href="/login/">Sign in</a>
  </div>
</body>
</html>

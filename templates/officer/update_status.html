{% extends 'base.html' %}

{% block content %}

<div class="container-fluid">
  <div class="page-hero dark-hero">
    <div>
      <span class="hero-eyebrow">Case Management</span>
      <h2>Update Case Status</h2>
      <p>Tracking ID: {{ complaint.tracking_id }} — {{ complaint.title }}</p>
    </div>
    <div class="hero-icon">
      <i class="bi bi-pencil-square"></i>
    </div>
  </div>

  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card">
        <div class="card-header">Status Update</div>
        <div class="card-body">
          <form method="post">
            {% csrf_token %}
            <div class="mb-3">
              <label class="form-label">New Status</label>
              <select name="status" class="form-select">
                {% for value,label in complaint.STATUS_CHOICES %}
                <option value="{{ value }}" {% if complaint.status == value %}selected{% endif %}>
                  {{ label }}
                </option>
                {% endfor %}
              </select>
            </div>
            <div class="d-flex gap-2">
              <button class="btn btn-warning">
                <i class="bi bi-save me-1"></i> Update Status
              </button>
              <a href="{% url 'complaint_detail' complaint.id %}" class="btn btn-outline-secondary">
                Cancel
              </a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

</div>

{% endblock %}
